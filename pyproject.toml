[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-dial-training"
version = "0.1.0"
description = "Periodically capture, annotate and crop pictures of analog wrist watches for TensorFlow training data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.scripts]
watch-dial-capture = "watch_dial_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
